name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Pull fresh identity data from the Limbus Company Wiki before building
        type: boolean
        default: true
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh data from the Limbus Company Wiki
        id: data
        if: github.event_name == 'schedule' || inputs.refresh
        run: npm run data
        continue-on-error: true

      - name: Save the refreshed data to the repo
        if: steps.data.outcome == 'success'
        continue-on-error: true
        run: |
          git add public/data public/img
          if git diff --cached --quiet; then
            echo "No data changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh data from the Limbus Company Wiki ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
